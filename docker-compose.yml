version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whitfield_wms_api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017/whitfield_wms?replicaSet=rs0
      - DATABASE_NAME=whitfield_wms
      - SECRET_KEY=development_jwt_secret_key_change_in_prod
      - ENV=development
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    restart: always

  mongo:
    image: mongo:7.0
    container_name: whitfield_wms_mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-setup:
    image: mongo:7.0
    container_name: whitfield_wms_mongo_setup
    depends_on:
      - mongo
    entrypoint:
      - bash
      - -c
      - |
        echo "Waiting for MongoDB startup..."
        until mongosh --host mongo:27017 --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
          sleep 1
        done
        echo "Initializing single-node replica set rs0..."
        mongosh --host mongo:27017 --eval "
          try {
            rs.status();
            console.log('Replica set already initialized');
          } catch (e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]});
            console.log('Replica set rs0 initiated successfully');
          }
        "

volumes:
  mongo_data:
